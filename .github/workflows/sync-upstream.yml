name: Sync upstream

# 无人值守：上游一有变动就同步，并自动重新打出带「IPV6 禁用默认关闭」的发布包。
# 任何一步失败都会停下来（不发布半成品），并开 issue 提醒。
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 强制重建发布包（上游没变也重建）
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  # fork 里 gh 默认会指向上游仓库，必须显式指定为「本仓库」
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TG-Twilight/Gameware-Cleaner.git 2>/dev/null || true
          git fetch --no-tags upstream main
          echo "上游 HEAD: $(git rev-parse --short upstream/main) / 本地 HEAD: $(git rev-parse --short HEAD)"
          before=$(git rev-parse HEAD)
          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error::上游改动与本 fork 冲突，已中止（不会推送、也不会发布）"
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "已合并上游 $(git rev-parse --short upstream/main)"
          fi

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin HEAD:main
          echo "已推送 $(git log -1 --oneline)"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = [regex]::Match((Get-Content -Raw LeiGod-OneClick.ps1), "\`$script:ScriptVersion = '([0-9][^']*)'")
          if (-not $m.Success) { Write-Error '读不到上游版本号'; exit 1 }
          Write-Output ("base=" + $m.Groups[1].Value) >> $env:GITHUB_OUTPUT
          Write-Output ("上游版本 " + $m.Groups[1].Value)
          $global:LASTEXITCODE = 0

      - name: Check if release already exists
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.base }}"
          $exists = 'false'
          $out = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $out) { $exists = 'true' }
          Write-Output ("exists=" + $exists) >> $env:GITHUB_OUTPUT
          Write-Output ("tag=" + $tag) >> $env:GITHUB_OUTPUT
          Write-Output ("release " + $tag + " 已存在：" + $exists)
          $global:LASTEXITCODE = 0

      - name: Build package
        id: build
        if: steps.merge.outputs.changed == 'true' || steps.rel.outputs.exists == 'false' || inputs.force == true
        shell: pwsh
        run: |
          ./tools/build-release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Syntax check built script
        if: steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $errs = $null
          $f = Get-ChildItem build -Recurse -Filter 'LeiGod-OneClick.ps1' | Select-Object -First 1
          if (-not $f) { Write-Error '构建产物里没有脚本'; exit 1 }
          [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
          if ($errs -and $errs.Count -gt 0) {
            $errs | Select-Object -First 10 | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }
            Write-Error '补丁后的脚本语法检查不通过，不发布'
            exit 1
          }
          Write-Output "语法检查通过：$($f.Name)"
          $global:LASTEXITCODE = 0

      - name: Publish release
        if: steps.build.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $zip = Get-ChildItem build -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { Write-Error '没有找到 zip'; exit 1 }
          $tag = "${{ steps.rel.outputs.tag }}"
          $base = "${{ steps.ver.outputs.base }}"
          $name = "v$base"
          $notes = @"
          基于上游 [v$base](https://github.com/TG-Twilight/Gameware-Cleaner/releases/tag/v$base)，
          自动重新打包并加入本 fork 的唯一改动：

          ## 「系统设置 → IPV6 禁用」默认关闭并固定为关闭

          - 设置页：开关默认关闭、读取旧设置时按关闭处理、去掉自动打开的逻辑、开关点击置空
          - 加速参数：banipv6:+P → banipv6:0
          - 想保留雷神原行为：运行时选 N，或加 -DisabledFeatures KeepIpv6

          上游脚本本身没有任何改动，补丁由 tools/ipv6-off.ps1 在打包时注入，
          所以上游怎么改都不会与本 fork 冲突。
          原始代码 Copyright (C) 2026 TG-Twilight，GPL-3.0-only。
          "@
          $exists = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $exists) {
            gh release upload $tag $zip.FullName --clobber
            if ($LASTEXITCODE -ne 0) { Write-Error "上传附件失败（$LASTEXITCODE）"; exit 1 }
            Write-Output "已更新附件：$($zip.Name)"
          } else {
            gh release create $tag $zip.FullName --title $name --notes $notes --target main
            if ($LASTEXITCODE -ne 0) { Write-Error "创建 release 失败（$LASTEXITCODE）"; exit 1 }
            Write-Output "已创建 release：$tag"
          }
          $global:LASTEXITCODE = 0

      - name: Open issue when manual work is needed
        if: failure()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = '同步/打包失败，需要手动处理'
          $open = @(gh issue list --state open --limit 100 --json number,title 2>$null | ConvertFrom-Json)
          if (@($open | Where-Object { $_.title -eq $title }).Count -gt 0) {
            Write-Output '已有未关闭的提示 issue，跳过'
          } else {
            $body = '定时任务失败。可能原因：(1) 上游改动与本 fork 冲突；(2) 上游脚本结构变化导致补丁锚点失效（需要适配 tools/ipv6-off.ps1）；(3) 补丁后语法检查不通过；(4) 发布 release 失败。请打开 Actions 里这次运行的日志定位；修好后关掉本 issue。'
            gh issue create --title $title --body $body
            if ($LASTEXITCODE -eq 0) { Write-Output '已创建提示 issue' } else { Write-Warning "创建 issue 失败（$LASTEXITCODE）" }
          }
          $global:LASTEXITCODE = 0